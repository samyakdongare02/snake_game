name: Build Android APK

on:
  push:
    paths:
      - "**.py"
      - "buildozer.spec"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev \
            libffi-dev libssl-dev \
            patchelf cmake

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install "buildozer==1.5.0" cython virtualenv

      - name: Cache buildozer / Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.android
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Build debug APK
        run: |
          # Accept Android SDK licenses non-interactively
          yes | buildozer -v android debug || true
          # Retry once if license step exited early
          if ! ls bin/*.apk >/dev/null 2>&1; then
            yes | buildozer -v android debug
          fi
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
          BUILDOZER_ANDROID_ACCEPT_ANDROID_SDK_LICENSES: "1"

      - name: List APK output
        run: |
          ls -la bin || true
          find bin -name "*.apk" -type f || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nokia-snake-apk
          path: bin/*.apk
          if-no-files-found: error
