name: Android APK

# Builds a signed, installable APK on every push so end users never need
# Android Studio, the Android SDK, Buildozer, keytool or apksigner locally.
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # needed only for the optional GitHub Release step

env:
  PYTHON_VERSION: "3.11"
  APP_NAME: Snake
  APP_VERSION: "1.0.0"

jobs:
  build:
    name: Build & sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # python-for-android needs a fair amount of disk; the runner ships with
      # large SDKs we do not need.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      "${AGENT_TOOLSDIRECTORY}/Android" 2>/dev/null || true
          df -h /

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache Buildozer / python-for-android
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.cache/pip
          # The recipe directory is part of the key so that changing a local
          # recipe (e.g. the libffi workaround) invalidates the cached build.
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}-${{ hashFiles('p4a-recipes/**') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          set -eu
          sudo apt-get update
          # autoconf/automake/libtool/libtool-bin/libltdl-dev/autoconf-archive
          # are what python-for-android's autotools-based recipes (libffi,
          # openssl, ...) need; libltdl-dev in particular defines the
          # LT_SYS_SYMBOL_USCORE macro.
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache git zip unzip \
            autoconf automake libtool libtool-bin autoconf-archive pkg-config \
            zlib1g-dev cmake libltdl-dev libffi-dev libssl-dev \
            openjdk-17-jdk
          # The ncurses dev package was renamed between Ubuntu releases.
          sudo apt-get install -y --no-install-recommends libncurses-dev libtinfo6 \
            || sudo apt-get install -y --no-install-recommends \
                 libncurses5-dev libncursesw5-dev libtinfo5
          echo "JAVA_HOME=$(dirname "$(dirname "$(readlink -f "$(which javac)")")")" \
            >> "$GITHUB_ENV"
          java -version

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # buildozer 1.6.0 is the current release and pairs with the
          # python-for-android revision pinned in buildozer.spec.  Cython is
          # capped at 3.0.12 because that is the newest version p4a's Kivy
          # recipe accepts (it declares ``cython>=0.29.1,<=3.0.12``).
          python -m pip install "buildozer==1.6.0" "cython==3.0.12"

      # Fast gate: the pure-Python game logic must pass its self-test.
      - name: Run logic self-test
        run: |
          python snake_core.py
          python main.py --self-test

      - name: Generate icon and splash (procedural, no assets committed)
        run: python tools/make_branding.py

      # A stable signing key is *optional*.  When the repository secrets are
      # present they are used; otherwise an ephemeral key is generated for this
      # build only (nothing secret is ever committed).
      - name: Prepare signing keystore
        id: keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -eu
          KS="$RUNNER_TEMP/release.keystore"
          if [ -n "${KS_B64:-}" ]; then
            printf '%s' "$KS_B64" | base64 -d > "$KS"
            echo "store_pass=${KS_STORE_PASS}" >> "$GITHUB_OUTPUT"
            echo "key_pass=${KS_KEY_PASS:-$KS_STORE_PASS}" >> "$GITHUB_OUTPUT"
            echo "alias=${KS_ALIAS:-snake}" >> "$GITHUB_OUTPUT"
            echo "kind=project" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing with the repository keystore."
          else
            PASS="$(python -c 'import secrets; print(secrets.token_urlsafe(27))')"
            keytool -genkeypair -v -keystore "$KS" -alias snake \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=Snake, OU=Games, O=Snake Game, C=US"
            echo "store_pass=${PASS}" >> "$GITHUB_OUTPUT"
            echo "key_pass=${PASS}" >> "$GITHUB_OUTPUT"
            echo "alias=snake" >> "$GITHUB_OUTPUT"
            echo "kind=ephemeral" >> "$GITHUB_OUTPUT"
            echo "::warning::No keystore secret found - using an ephemeral key. \
          Add ANDROID_KEYSTORE_BASE64 et al. for upgradeable releases."
          fi
          echo "path=$KS" >> "$GITHUB_OUTPUT"

      - name: Build release APK (Buildozer)
        env:
          APP_ANDROID_ACCEPT_SDK_LICENSE: "1"
          ACCEPT_ANDROID_SDK_LICENSE: "1"
          CI: "true"
        run: |
          set -o pipefail
          export BUILDOZER_WARN_ON_ROOT=0
          buildozer -v android release 2>&1 | tail -n 400

      - name: Sign and verify the APK
        env:
          KS_PATH: ${{ steps.keystore.outputs.path }}
          KS_STORE_PASS: ${{ steps.keystore.outputs.store_pass }}
          KS_KEY_PASS: ${{ steps.keystore.outputs.key_pass }}
          KS_ALIAS: ${{ steps.keystore.outputs.alias }}
        run: |
          set -eu
          BT="$(ls -d "$HOME"/.buildozer/android/platform/android-sdk/build-tools/*/ \
                | sort -V | tail -n 1)"
          UNSIGNED="$(find bin -name '*-release-unsigned.apk' | head -n 1)"
          if [ -z "$UNSIGNED" ]; then
            UNSIGNED="$(find bin -name '*-release.apk' ! -name '*unsigned*' | head -n 1)"
          fi
          echo "Unsigned APK: $UNSIGNED"
          test -n "$UNSIGNED"

          OUT="bin/${APP_NAME}-${APP_VERSION}.apk"
          "${BT}zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "${BT}apksigner" sign \
            --ks "$KS_PATH" --ks-key-alias "$KS_ALIAS" \
            --ks-pass "pass:${KS_STORE_PASS}" \
            --key-pass "pass:${KS_KEY_PASS}" \
            --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          "${BT}apksigner" verify --print-certs "$OUT"
          echo "Signed APK -> $OUT"
          ls -lh "$OUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ env.APP_VERSION }}-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to a GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.apk
          generate_release_notes: true
